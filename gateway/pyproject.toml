[project]
name = "oasa-gateway"
version = "0.1.0"
description = "OASA Gateway — Immutable audit logging for AI APIs"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "ss-core",
    "ss-crypto",
    "ss-cas",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "httpx",  # For TestClient
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oasa_gateway*"]
