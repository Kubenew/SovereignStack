apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sovereignstack-kernel-scaler
  namespace: {{ .Release.Namespace | default "sovereignstack" }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sovereignstack-kernel
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Pods
      pods:
        metric:
          name: container_gpu_vram_saturation_ratio
        target:
          type: AverageValue
          averageValue: "85m"
    - type: Object
      object:
        metric:
          name: oasa_gateway_prompt_queue_depth
        describedObject:
          apiVersion: apps/v1
          kind: Deployment
          name: sovereignstack-kernel
        target:
          type: Value
          value: "50"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
