[project]
name = "sovereignstack"
version = "0.1.0"
description = "SovereignStack Phase 1: OASA Gateway — Immutable audit logging for AI APIs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "SovereignStack Contributors" },
]

[tool.pytest.ini_options]
testpaths = [
    "libs/ss-core/tests",
    "libs/ss-crypto/tests",
    "libs/ss-cas/tests",
    "gateway/tests",
    "cli/tests",
    "tests",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
