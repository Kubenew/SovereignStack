[package]
name = "sovereignstack-reference-node"
version = "0.1.0"
edition = "2021"
description = "SovereignStack Reference Node — minimal implementation with kernel, identity, sessiond, bus, CAS. No AI, no swarm, no federation — just core architecture."

[[bin]]
name = "ss-node"
path = "src/main.rs"

[dependencies]
ss-kernel = { path = "../ss-kernel" }
ss-crypto = { path = "../ss-crypto" }
ss-core = { path = "../ss-core" }
ss-sessiond = { path = "../ss-sessiond", optional = true }
ss-cas = { path = "../ss-cas", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = "0.5"
hyper = { version = "1", features = ["full"] }

[features]
default = []
full = ["ss-sessiond", "ss-cas"]
