  <text x="50" y="370" fill="#8b949e" font-size="11">Knowledge Objects · Reasoning Objects · Memory Protocol · Provenance Graph · Content-Addressable Storage</text>
  <text x="750" y="370" fill="#8b949e" font-size="10">RFC-0005 · 0006 · 0017 · 0013 · 0018</text>

  <!-- Layer 1: Agent & Communication -->
  <rect x="30" y="400" width="840" height="60" rx="4" fill="#3d2e1e" stroke="#d29922" stroke-width="1"/>
  <text x="50" y="422" fill="#d29922" font-weight="bold">Layer 1: Agent, Communication &amp; Scheduling</text>
  <text x="50" y="440" fill="#8b949e" font-size="11">Agent Communication · Session Runtime · Capability Registry · Swarm Coordination</text>
  <text x="750" y="440" fill="#8b949e" font-size="10">RFC-0014 · 0003 · 0004 · 0027</text>

  <!-- Layer 0a: Fabric & Topology -->
  <rect x="30" y="470" width="840" height="80" rx="4" fill="#2d1b2e" stroke="#bc8cff" stroke-width="1"/>
  <text x="50" y="492" fill="#bc8cff" font-weight="bold">Layer 0a: Fabric, Topology &amp; Scheduling</text>
  <text x="50" y="510" fill="#8b949e" font-size="11">Network Topology · AI Fabric Protocol · KV Locality Scheduling · Fabric Telemetry</text>
  <text x="50" y="528" fill="#8b949e" font-size="11">Distributed KV Placement · Topology-Aware Federation · Memory Fabric · Cluster Profiles</text>
  <text x="750" y="528" fill="#8b949e" font-size="10">RFC-0030–0037</text>

  <!-- Layer -1: Cross-cutting -->
  <rect x="30" y="560" width="840" height="60" rx="4" fill="#1c1c1c" stroke="#484f58" stroke-width="1"/>
  <text x="50" y="582" fill="#8b949e" font-weight="bold">Cross-cutting: Audit, Certification &amp; Compliance</text>
