<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Monaco, monospace" font-size="12">
  <rect width="900" height="700" fill="#0d1117"/>
  <text x="450" y="30" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">SovereignStack Protocol Stack (RFCs 0001–0037)</text>

  <!-- Layer 6: Constitutional -->
  <rect x="30" y="50" width="840" height="60" rx="4" fill="#1a3a5c" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="50" y="72" fill="#58a6ff" font-weight="bold">Layer 6: Constitutional &amp; Governance</text>
  <text x="50" y="90" fill="#8b949e" font-size="11">Constitution · Governance · RFC Process · Standards Framework</text>
  <text x="750" y="90" fill="#8b949e" font-size="10">RFC-0000</text>

  <!-- Layer 5: Object Model -->
  <rect x="30" y="120" width="840" height="60" rx="4" fill="#1a3a5c" stroke="#58a6ff" stroke-width="1"/>
  <text x="50" y="142" fill="#58a6ff" font-weight="bold">Layer 5: Universal Object Model</text>
  <text x="50" y="160" fill="#8b949e" font-size="11">Core Object Model · URI Standard + ABNF · Cryptographic Signatures</text>
  <text x="750" y="160" fill="#8b949e" font-size="10">RFC-0001 · 0002 · 0012</text>

  <!-- Layer 4: Identity & Trust -->
  <rect x="30" y="190" width="840" height="60" rx="4" fill="#1a3a5c" stroke="#58a6ff" stroke-width="1"/>
  <text x="50" y="212" fill="#58a6ff" font-weight="bold">Layer 4: Identity, Trust &amp; Security</text>
  <text x="50" y="230" fill="#8b949e" font-size="11">DID Resolution · Trust Graph · Reputation Scoring · Capability Delegation · Policy Enforcement · Jurisdiction</text>
  <text x="750" y="230" fill="#8b949e" font-size="10">RFC-0003 · 0011 · 0019 · 0020 · 0021 · 0026</text>

  <!-- Layer 3: Core Runtime -->
  <rect x="30" y="260" width="840" height="60" rx="4" fill="#1e3a2f" stroke="#3fb950" stroke-width="1"/>
  <text x="50" y="282" fill="#3fb950" font-weight="bold">Layer 3: Core Runtime</text>
  <text x="50" y="300" fill="#8b949e" font-size="11">Session Lifecycle · Event Bus · Resource Allocation · Workflow Execution · Extension System</text>
  <text x="750" y="300" fill="#8b949e" font-size="10">RFC-0009 · 0007 · 0016 · 0015 · 0023</text>

  <!-- Layer 2: Intelligence Primitives -->
  <rect x="30" y="330" width="840" height="60" rx="4" fill="#1e3a2f" stroke="#3fb950" stroke-width="1"/>
