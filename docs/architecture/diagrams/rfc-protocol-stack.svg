  <rect x="30" y="640" width="840" height="40" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="50" y="653" width="12" height="12" fill="#58a6ff"/>
  <text x="68" y="663" fill="#8b949e" font-size="10">Constitutional/Identity (1–3, 11–12, 19–21, 26)</text>
  <rect x="350" y="653" width="12" height="12" fill="#3fb950"/>
  <text x="368" y="663" fill="#8b949e" font-size="10">Runtime/Intelligence (5–7, 9, 13, 15–18)</text>
  <rect x="630" y="653" width="12" height="12" fill="#bc8cff"/>
  <text x="648" y="663" fill="#8b949e" font-size="10">Fabric/Scheduling (30–37)</text>
