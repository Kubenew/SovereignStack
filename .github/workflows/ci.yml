name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Rust: MUST PASS ──
  rust-core:
    name: "Rust Core (MUST PASS)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace -- --ignored || true  # run ignored but don't block

  # ── Python Core: MUST PASS ──
  python-core:
    name: "Python Core (MUST PASS)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Run verification gate
        run: bash verify.sh

  # ── Python Experimental: MAY FAIL ──
  python-experimental:
    name: "Python Experimental (non-blocking)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install all dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-asyncio
      - name: Run all tests
        run: pytest tests/ -v --tb=short || true

  # ── Pre-merge gate ──
  gate:
    name: "Release Gate"
    needs: [rust-core, python-core]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All gates passed"
