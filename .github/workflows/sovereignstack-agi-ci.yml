name: SovereignStack AGI Readiness CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  rust-core-build:
    name: Rust Core Compilation & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Static Code Analysis (Clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Core & Module Unit Tests
        run: cargo test --workspace --verbose

  python-economy-validation:
    name: Python Economy & Simulation Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install regex

      - name: Execute Economy Ledger Verification Suite
        run: |
          python -m unittest discover -s scripts -p "test_*.py" -v

  build-success-gate:
    name: AGI Pipeline Gatekeeper
    needs: [rust-core-build, python-economy-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Verification Complete
        run: echo "SovereignStack core components successfully verified for deployment."
