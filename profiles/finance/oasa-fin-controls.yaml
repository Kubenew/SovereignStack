name: OASA-FIN Control Catalog
profile: OASA-FIN
version: "1.0.0"
standard: RFC-0077
engine: RFC-0076
anchor:
  - MiFID II
  - PSD2
  - DORA
cadence_default: continuous
control_sections:
  - id: FIN-AUTH
    title: Transactional Authorization
    controls:
      - id: FIN-AUTH-01
        requirement: Every payment/execution is policy-authorized before action.
        evidence_type: authorization
        source: RFC-0075
        threshold: "authorized == true"
        cadence: continuous
      - id: FIN-AUTH-02
        requirement: Every authorization decision is evidence-recorded with full policy set.
        evidence_type: authorization
        source: RFC-0075
        threshold: "evidence.policies_count >= 1"
        cadence: continuous
      - id: FIN-AUTH-03
        requirement: Unresolved policy conflicts must halt and escalate to human override.
        evidence_type: conflict
        source: RFC-0075
        threshold: "no unresolved conflict remains open > 24h"
        cadence: continuous
      - id: FIN-AUTH-04
        requirement: Conflict resolutions are recorded as conflict:// evidence objects.
        evidence_type: conflict
        source: RFC-0075
        threshold: "conflict.evidence.signature non-empty"
        cadence: continuous

  - id: FIN-REC
    title: Record Integrity
    controls:
      - id: FIN-REC-01
        requirement: All records are content-addressed and Merkle-protected.
        evidence_type: data_integrity
        source: RFC-0018
        threshold: "merkle_proof.valid == true"
        cadence: continuous
      - id: FIN-REC-02
        requirement: Tampering with any historical record is detected within one block.
        evidence_type: data_integrity
        source: RFC-0018
        threshold: "detection_latency <= 1 block"
        cadence: continuous
      - id: FIN-REC-03
        requirement: Audit evidence is immutable; deletion requires signed tombstone.
        evidence_type: audit
        source: RFC-0022
        threshold: "tombstone.signed == true"
        cadence: continuous

  - id: FIN-INC
    title: Incident Detection & Response (DORA)
    controls:
      - id: FIN-INC-01
        requirement: ICT incidents are detected, classified, and logged.
        evidence_type: incident_response
        source: DORA Art.17-18
        threshold: "detected == true"
        cadence: continuous
      - id: FIN-INC-02
        requirement: Major incidents reported within statutory window (24h).
        evidence_type: incident_response
        source: DORA Art.19
        threshold: "reporting_latency <= 24h"
        cadence: event
      - id: FIN-INC-03
        requirement: Incident response plans are exercised at required cadence.
        evidence_type: incident_response
        source: DORA Art.21
        threshold: "last_tlpt_exercise < 12 months"
        cadence: monthly

  - id: FIN-TPR
    title: Third-Party Oversight (DORA)
    controls:
      - id: FIN-TPR-01
        requirement: All delegated capabilities are mapped and risk-rated.
        evidence_type: delegation
        source: RFC-0026
        threshold: "delegation.map_coverage == 1.0"
        cadence: continuous
      - id: FIN-TPR-02
        requirement: Critical third-party dependencies are registered and monitored.
        evidence_type: delegation
        source: DORA Art.28-30
        threshold: "critical_dependencies.monitored == true"
        cadence: weekly

  - id: FIN-EXE
    title: Autonomous Execution Governance
    controls:
      - id: FIN-EXE-01
        requirement: Every autonomous action is bounded by an evidence-recorded authorization envelope.
        evidence_type: execution
        source: RFC-0075
        threshold: "authorization_boundary.present == true"
        cadence: continuous
      - id: FIN-EXE-02
        requirement: Actions outside the authorization boundary halt and escalate.
        evidence_type: execution
        source: RFC-0075
        threshold: "boundary_violations.escalated == true"
        cadence: continuous
      - id: FIN-EXE-03
        requirement: Settlements complete within mandated windows.
        evidence_type: settlement
        source: PSD2
        threshold: "settlement <= T+1"
        cadence: daily
