# =============================================================================
# SovereignStack Component Registry — Single Source of Truth
# =============================================================================
# This file is the authoritative record of what exists, what is a stub,
# and what each component's maturity level is.
#
# Status values:
#   implemented  — Has working code with inline tests
#   partial      — Has code but incomplete or untested
#   stub         — Placeholder only (≤10 lines of real code)
#   empty        — Directory exists but contains no code
#
# Maturity values:
#   core         — Required for Core Contract (v0.5)
#   core-support — Supports core but not on critical path
#   experimental — Research/exploration, not required for release
#   deprecated   — Scheduled for removal or merge
#
# v0.5 Actions:
#   verify       — Confirm existing implementation satisfies Core Contract
#   implement    — Must be built for v0.5
#   keep         — No changes needed
#   freeze       — Do not modify during v0.5 sprint
# =============================================================================

