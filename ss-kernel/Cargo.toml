[package]
name = "ss-kernel"
version = "0.1.0"
edition = "2021"
description = "SovereignStack Kernel — core system services: identity, URI resolution, event bus, object registry, capability enforcement, policy engine"

[dependencies]
ss-crypto = { path = "../ss-crypto" }
ss-core = { path = "../ss-core" }
ed25519-dalek = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
parking_lot = "0.12"
dashmap = "6"

[lib]
name = "ss_kernel"
path = "src/lib.rs"
